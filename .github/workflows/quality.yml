name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 1 * *" # Monthly security scan
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install zsh for shell-isolation regressions
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Pattern checks
        run: npm run test:patterns
      - name: Command README sync
        run: bash scripts/check-command-readme.sh
      - name: CSC-1 command/skill contract (strict)
        run: python3 scripts/csc_lint.py --strict

      # Skills over ~5k tokens are SILENTLY TRUNCATED after compaction (only the
      # first 5,000 tokens of each are re-attached). #70 split skills/quality
      # back under budget — this is now a hard gate so the regression can't
      # recur silently.
      - name: Skill size (compaction re-attach budget)
        run: bash scripts/check-skill-size.sh

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test

  security:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install Semgrep
        run: python -m pip install semgrep==1.168.0
      - name: Dependency audit
        run: npm audit --audit-level high
      - name: License policy
        run: npm run license:check
      - name: Semgrep security scan
        run: npm run security:scan:ci
