name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 1 * *" # Monthly security scan
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Pattern checks
        run: npm run test:patterns
      - name: Command README sync
        run: bash scripts/check-command-readme.sh
      - name: CSC-1 command/skill contract (strict)
        run: python3 scripts/csc_lint.py --strict

      # Skills over ~5k tokens are SILENTLY TRUNCATED after compaction (only the
      # first 5,000 tokens of each are re-attached). #70 split skills/quality
      # back under budget — this is now a hard gate so the regression can't
      # recur silently.
      - name: Skill size (compaction re-attach budget)
        run: bash scripts/check-skill-size.sh

  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - run: npm ci
      - name: Run tests
        run: npm test

  security:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level high
      - name: Dependency licenses
        run: npm run license:check
