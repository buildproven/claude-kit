name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 1 * *" # Monthly security scan
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single job by design. These checks were previously three parallel jobs
  # (lint-and-format / test / security), each repeating checkout + setup-node +
  # `npm ci`. Every job is billed rounded UP to a whole minute, and each of the
  # three finished well under 60s, so the split cost ~3 billed minutes per run
  # for ~110s of real work — plus three redundant dependency installs.
  #
  # Merging them keeps every check and runs `npm ci` once. Steps still fail
  # independently: a red step fails the job and the step name identifies it in
  # the run log.
  #
  # Re-split only if a step grows long enough that wall-clock parallelism beats
  # the per-job round-up (roughly: >2 min). If you do, update the required
  # status checks on main to match the new job names or PRs will block on
  # contexts that never report.
  quality:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install zsh for shell-isolation regressions
        # Leave runner-level headroom for sudo and apt cleanup after the
        # command-level timeouts below have expired.
        timeout-minutes: 4
        run: |
          if command -v zsh >/dev/null 2>&1; then
            zsh --version
            exit 0
          fi
          timeout 30s sudo apt-get update
          timeout 150s sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            -o Acquire::Retries=3 \
            install --yes zsh
      - run: npm ci
      - name: Install Semgrep
        run: python -m pip install semgrep==1.168.0

      # --- lint and format (was: lint-and-format) ---
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Pattern checks
        run: npm run test:patterns
      - name: Command README sync
        run: bash scripts/check-command-readme.sh
      - name: CSC-1 command/skill contract (strict)
        run: python3 scripts/csc_lint.py --strict

      # Skills over ~5k tokens are SILENTLY TRUNCATED after compaction (only the
      # first 5,000 tokens of each are re-attached). #70 split skills/quality
      # back under budget — this is now a hard gate so the regression can't
      # recur silently.
      - name: Skill size (compaction re-attach budget)
        run: bash scripts/check-skill-size.sh
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Plugin manifest validation
        run: |
          claude plugin validate .claude-plugin/plugin.json
          claude plugin validate .claude-plugin/marketplace.json

      # PRs and pushes run only the repository-owned affected plan. The
      # selector fails visibly for unmapped executable paths; it never turns
      # uncertainty into a full-suite fallback. Scheduled/manual audits retain
      # the explicit complete regression.
      - name: Run affected tests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          mapfile -d '' changed < "$RUNNER_TEMP/changed-paths"
          node scripts/test-impact.js --execute -- "${changed[@]}"
      - name: Run affected tests after merge
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          mapfile -d '' changed < "$RUNNER_TEMP/changed-paths"
          node scripts/test-impact.js --execute -- "${changed[@]}"
      - name: Run complete regression audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm test

      # --- security (was: security) ---
      - name: Dependency audit
        run: npm audit --audit-level high
      - name: License policy
        run: npm run license:check
      - name: Semgrep security scan
        run: npm run security:scan:ci
