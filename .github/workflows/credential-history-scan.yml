name: Credential History Scan

on:
  pull_request:
    branches: [main]
    # Do not path-filter this workflow: credentials can be committed in any
    # file, including documentation, configuration, or a transient file later
    # deleted in the same pull request.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  credential-history-scan:
    name: credential-history-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"
          matches=$(grep -c " ${archive}$" "gitleaks_${version}_checksums.txt" || true)
          test "$matches" -eq 1
          grep " ${archive}$" "gitleaks_${version}_checksums.txt" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --to-stdout gitleaks > "$RUNNER_TEMP/gitleaks"
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan introduced history with trusted policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          # The policy comes from the trusted base, so a pull request cannot
          # weaken its own detection rules while adding a credential.
          git show "$BASE_SHA:.gitleaks.toml" > "$RUNNER_TEMP/.gitleaks.toml"
          "$RUNNER_TEMP/gitleaks" git \
            --config "$RUNNER_TEMP/.gitleaks.toml" \
            --ignore-gitleaks-allow \
            --max-archive-depth 1 \
            --redact \
            --log-opts="--diff-merges=first-parent -a ${BASE_SHA}..${HEAD_SHA}"
