name: Product Evidence Source

on:
  repository_dispatch:
    types: [product-evidence-request]

permissions:
  contents: read

jobs:
  collect-product-evidence:
    # This worker intentionally runs the candidate. It has no secrets and only
    # emits raw logs; a different protected worker validates and signs them.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate protected request
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          node -e '
            const p = JSON.parse(process.env.PAYLOAD);
            const document = (value) => /^docs\/(?:(?:prd|decisions)\/)?[a-zA-Z0-9._-]+\.md$/.test(value || "");
            if (!Number.isSafeInteger(p.pullRequest) || p.pullRequest < 1 || !/^[0-9a-f]{40}$/.test(p.base || "") || !/^[0-9a-f]{40}$/.test(p.head || "") || !/^[0-9a-f]{32}$/.test(p.nonce || "") || !document(p.prd) || !document(p.tasks)) process.exit(1);
          '
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install zsh for shell-isolation regressions
        timeout-minutes: 4
        env:
          ZSH_PROVENANCE: ${{ runner.temp }}/product-evidence-zsh-version.log
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            timeout 30s sudo apt-get update
            timeout 150s sudo env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Acquire::Retries=3 \
              install --yes zsh
          fi
          command -v zsh >/dev/null 2>&1
          {
            zsh --version
            printf 'zsh-package=%s\n' "$(dpkg-query --showformat='${Version}' --show zsh)"
          } > "$ZSH_PROVENANCE"
      - name: Upload environment provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-evidence-source-environment-${{ github.run_id }}
          path: ${{ runner.temp }}/product-evidence-zsh-version.log
          if-no-files-found: error
          retention-days: 7
      - name: Run allowlisted behavioral command
        id: behavioral
        continue-on-error: true
        run: npm ci && npm test > behavioral-tests.log 2>&1
      - name: Run allowlisted acceptance command
        id: acceptance
        if: always()
        continue-on-error: true
        run: npm run test:patterns > acceptance-evidence.log 2>&1
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-evidence-source-diagnostic-${{ github.run_id }}
          path: |
            behavioral-tests.log
            acceptance-evidence.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce evidence command success
        if: always()
        env:
          BEHAVIORAL_OUTCOME: ${{ steps.behavioral.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          test "$BEHAVIORAL_OUTCOME" = success
          test "$ACCEPTANCE_OUTCOME" = success
      - name: Build raw evidence bundle
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          node -e '
            const fs = require("fs"); const p = JSON.parse(process.env.PAYLOAD);
            const request = { schemaVersion: 1, repository: process.env.GITHUB_REPOSITORY, repositoryId: String(process.env.REPOSITORY_ID), pullRequest: p.pullRequest, base: p.base, head: p.head, nonce: p.nonce, behavioralCommand: "npm test", acceptanceCommand: "npm run test:patterns" };
            fs.mkdirSync("product-evidence-source", { mode: 0o700 });
            fs.writeFileSync("product-evidence-source/request.json", JSON.stringify(request) + "\n", { mode: 0o600 });
            const changedFiles = require("node:child_process").execFileSync("git", ["diff", "--name-only", "--no-renames", "-z", p.base, p.head], { encoding: "utf8" }).split("\0").filter(Boolean);
            fs.writeFileSync("product-evidence-source/changed-files.json", JSON.stringify(changedFiles) + "\n", { mode: 0o600 });
            for (const [from, to] of [[p.prd,"prd.md"],[p.tasks,"tasks.md"],["behavioral-tests.log","behavioral-tests.log"],["acceptance-evidence.log","acceptance-evidence.log"]]) fs.copyFileSync(from, `product-evidence-source/${to}`);
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-evidence-source-${{ github.run_id }}
          path: product-evidence-source
          if-no-files-found: error
          retention-days: 7
