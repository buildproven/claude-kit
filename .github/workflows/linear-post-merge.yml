name: Close Linear issues after merge

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  close-linear-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Close cited Linear issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: bash scripts/backlog-post-merge.sh
